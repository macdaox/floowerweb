name = "everstem"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[vars]
MEDIA_MAX_BYTES = "10485760"

[[d1_databases]]
binding = "DB"
database_name = "everstem-preview"
# Replace after `wrangler d1 create everstem-preview`.
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "everstem-media-preview"

[[env.production.d1_databases]]
binding = "DB"
database_name = "everstem-production"
# Replace after `wrangler d1 create everstem-production`.
database_id = "00000000-0000-0000-0000-000000000000"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "everstem-media-production"

[env.production.vars]
MEDIA_MAX_BYTES = "10485760"
